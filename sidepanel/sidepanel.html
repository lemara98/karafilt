<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Shared button/section/switch/slider styles. -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-row">
          <a href="https://karafilt.com" target="_blank" rel="noopener noreferrer" class="wordmark-link" title="Visit karafilt.com">
            <img src="../icons/wordmark.svg" alt="Karafilt" class="wordmark">
          </a>
          <button id="sp-party-btn" class="party-pill" title="Party mode — host a karaoke party">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
            </svg>
            <span>Party</span>
            <span class="party-pill-count" id="sp-party-count" hidden>0</span>
          </button>
        </div>
        <p class="song-title" id="song-title">—</p>
      </div>
      <div class="header-right">
        <div class="header-right-row">
          <span class="source-badge" id="source-badge"></span>
          <button id="refresh-lyrics" class="refresh-btn" title="Refresh lyrics">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-3-6.7"/>
              <polyline points="21 4 21 10 15 10"/>
            </svg>
          </button>
        </div>
        <label class="highlight-toggle-wrap" title="Sync: keep the active-line, scroll, and word highlight in step with the song. Turn off to scroll/read manually.">
          <span class="highlight-toggle-label">Sync</span>
          <span class="switch">
            <input type="checkbox" id="highlight-toggle" checked>
            <span class="switch-slider"></span>
          </span>
        </label>
        <label class="highlight-toggle-wrap" title="Focus mode: show three lines at a time and swap when the active line finishes the page">
          <span class="highlight-toggle-label">Focus</span>
          <span class="switch">
            <input type="checkbox" id="karaoke-toggle">
            <span class="switch-slider"></span>
          </span>
        </label>
      </div>
    </header>

    <div class="status" id="status">Waiting for media...</div>

    <!-- Alternative LRCLib matches the search returned. Hidden until the
         service worker forwards more than one candidate. -->
    <div class="alternatives-bar" id="alternatives-bar" style="display:none">
      <button class="alternatives-toggle" id="alternatives-toggle">
        <span>Wrong song? <span id="alternatives-count">0</span> more matches</span>
        <svg class="alternatives-chevron" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="alternatives-list" id="alternatives-list"></div>
    </div>

    <div class="lines-wrap">
      <div class="lines" id="lines"></div>
      <div class="lyrics-loader" id="lyrics-loader" style="display:none">
        <span></span><span></span><span></span>
      </div>
    </div>

    <button id="google-search" class="google-search-btn" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search lyrics on Google</span>
    </button>

    <!-- Filter control surface — same layout as the popup. When the side panel
         is open, the user shouldn't need to touch the popup at all. -->
    <div class="sp-controls">
      <div class="sp-status-row">
        <div class="status-badge" id="sp-status">
          <span class="status-dot"></span>
          <span class="status-text">Ready</span>
        </div>
      </div>

      <button id="sp-toggle" class="btn-toggle">
        <svg class="btn-icon play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6,3 20,12 6,21"/>
        </svg>
        <svg class="btn-icon stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
        <span class="btn-label">Start Filtering</span>
      </button>

      <div id="sp-countdown-overlay" class="countdown-overlay" style="display:none">
        <div class="countdown-hint">Get ready — auto-syncing the video</div>
        <div class="countdown-number" id="sp-countdown-number">3</div>
        <button id="sp-countdown-cancel" class="countdown-cancel">Cancel</button>
      </div>

      <div class="section">
        <div class="section-header">
          <label for="sp-mode">Mode</label>
        </div>
        <div class="select-wrap">
          <select id="sp-mode" data-fancy-mode>
            <option value="stft">Spectral (Good)</option>
            <option value="stft_deep">Spectral Deep (Strong)</option>
            <option value="basic">Basic (Fast)</option>
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <span class="hint" id="sp-mode-hint"></span>

        <div class="section-header settings-gap">
          <label for="sp-mix">Vocal Removal</label>
          <span class="mix-val" id="sp-mix-value">100%</span>
        </div>
        <div class="slider-track">
          <input type="range" id="sp-mix" min="0" max="100" value="100">
        </div>
      </div>

      <!-- Filter rating: how well did vocal removal work on this song? Tied to
           the current song + active mode; sidepanel.js shows it only when a
           song is playing and hides it after submit. -->
      <div class="section filter-rating" id="sp-rating" style="display:none">
        <div class="section-header">
          <label>Rate the filter on this song</label>
        </div>
        <div class="community-rating" id="sp-community-rating"></div>
        <div class="rating-stars" id="sp-rating-stars" role="radiogroup" aria-label="Filter quality rating">
          <button type="button" class="star" data-value="1" aria-label="1 star">★</button>
          <button type="button" class="star" data-value="2" aria-label="2 stars">★</button>
          <button type="button" class="star" data-value="3" aria-label="3 stars">★</button>
          <button type="button" class="star" data-value="4" aria-label="4 stars">★</button>
          <button type="button" class="star" data-value="5" aria-label="5 stars">★</button>
        </div>
        <div class="rating-expand" id="sp-rating-expand" style="display:none">
          <textarea id="sp-rating-comment" class="text-input rating-comment" rows="2" maxlength="2000" placeholder="Optional: what worked or didn't?"></textarea>
          <button id="sp-rating-submit" class="btn-toggle" disabled>Submit rating</button>
        </div>
        <span class="hint" id="sp-rating-status"></span>
      </div>

      <div class="settings-row">
        <!-- Account chip: karafilt.com session state (sidepanel.js fills it;
             hidden when no Website URL is configured). -->
        <a id="sp-account" class="account-chip" style="display:none" target="_blank" rel="noopener noreferrer" title="Karafilt account">
          <span class="account-avatar" id="sp-account-avatar">?</span>
          <span class="account-text">
            <span class="account-email" id="sp-account-email"></span>
          </span>
        </a>
        <button id="sp-settings-toggle" class="settings-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>

      <!-- Lyrics appearance: font family, size and the active-word highlight
           colour. sidepanel.js applies these as CSS variables on #lines and
           persists them in chrome.storage.local. -->
      <div class="section settings-panel" id="sp-settings-panel" style="display:none">
        <div class="section-header">
          <label for="sp-font-family">Lyrics font</label>
        </div>
        <div class="select-wrap">
          <select id="sp-font-family">
            <option value="default">Default</option>
            <option value="serif">Serif</option>
            <option value="rounded">Rounded</option>
            <option value="mono">Monospace</option>
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </div>

        <div class="section-header settings-gap">
          <label for="sp-font-size">Font size</label>
          <span class="mix-val" id="sp-font-size-value">100%</span>
        </div>
        <div class="slider-track">
          <input type="range" id="sp-font-size" min="80" max="200" step="10" value="100">
        </div>

        <div class="section-header settings-gap">
          <label for="sp-highlight-color">Highlight color</label>
          <input type="color" id="sp-highlight-color" class="color-input" value="#c084fc">
        </div>

        <button id="sp-reset-settings" class="reset-btn settings-gap">Reset to defaults</button>
      </div>
    </div>
  </div>

  <!-- Sign-in gate: covers the whole panel until the user is signed in.
       sidepanel.js shows/hides it from the GET_ACCOUNT_STATUS probe. -->
  <div id="auth-gate" class="auth-gate" style="display:none">
    <div class="auth-gate-card">
      <img src="../icons/wordmark.svg" alt="Karafilt" class="auth-gate-logo">
      <h2 class="auth-gate-title">Sign in to Karafilt</h2>
      <p class="auth-gate-text">Karafilt is free — sign in with your account to start removing vocals.</p>
      <button id="auth-gate-signin" class="btn-toggle">Sign in</button>
      <p class="auth-gate-hint">No account yet? You can create one on the sign-in page.</p>
    </div>
  </div>

  <script src="../shared/song-match.js"></script>
  <script src="../shared/video-key.js"></script>
  <script src="../shared/fancy-select.js"></script>
  <script src="../shared/controls-bindings.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
