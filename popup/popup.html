<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">

    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
          <rect x="22" y="8" width="20" height="32" rx="10" fill="url(#mic-grad)" stroke="#fff" stroke-width="2" stroke-opacity="0.3"/>
          <line x1="32" y1="44" x2="32" y2="52" stroke="url(#mic-grad)" stroke-width="3" stroke-linecap="round"/>
          <line x1="24" y1="52" x2="40" y2="52" stroke="url(#mic-grad)" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 32 C18 42, 46 42, 46 32" stroke="url(#mic-grad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- sound waves -->
          <path d="M50 20 C54 24, 54 32, 50 36" stroke="#ff6b9d" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
          <path d="M54 16 C60 22, 60 34, 54 40" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
          <defs>
            <linearGradient id="mic-grad" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
        </svg>
        <div>
          <h1>Karaoke Filter</h1>
          <p class="tagline">Real-time vocal removal</p>
        </div>
      </div>
      <div class="status-badge" id="status">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </header>

    <button id="toggle" class="btn-toggle">
      <svg class="btn-icon play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6,3 20,12 6,21"/>
      </svg>
      <svg class="btn-icon stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
      <span class="btn-label">Start Filtering</span>
    </button>

    <div class="section">
      <div class="section-header">
        <label for="mode">Algorithm</label>
      </div>
      <div class="select-wrap">
        <select id="mode">
          <option value="stft">Spectral (Good)</option>
          <option value="basic">Basic (Fast)</option>
          <option value="ai">AI Separation (Best)</option>
          <option value="ai2">AI + Deep Clean (Slower)</option>
        </select>
        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <span class="hint" id="mode-hint"></span>
    </div>

    <div class="section ai-panel" id="ai-options" style="display:none">
      <div class="section-header">
        <label for="ai-model">AI Model</label>
        <span class="badge">AI</span>
      </div>
      <div class="select-wrap">
        <select id="ai-model">
          <option value="htdemucs_ft">Demucs Fine-Tuned</option>
        </select>
        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <span class="hint" id="model-hint">Fetching models from server...</span>
    </div>

    <div class="section">
      <div class="section-header">
        <label for="mix">Vocal Removal</label>
        <span class="mix-val" id="mix-value">85%</span>
      </div>
      <div class="slider-track">
        <input type="range" id="mix" min="0" max="100" value="85">
      </div>
    </div>

    <footer>
      <span class="footer-text">♪ Enjoy the music ♪</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
