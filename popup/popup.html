<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">

    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
          <rect x="22" y="8" width="20" height="32" rx="10" fill="url(#mic-grad)" stroke="#fff" stroke-width="2" stroke-opacity="0.3"/>
          <line x1="32" y1="44" x2="32" y2="52" stroke="url(#mic-grad)" stroke-width="3" stroke-linecap="round"/>
          <line x1="24" y1="52" x2="40" y2="52" stroke="url(#mic-grad)" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 32 C18 42, 46 42, 46 32" stroke="url(#mic-grad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- sound waves -->
          <path d="M50 20 C54 24, 54 32, 50 36" stroke="#ff6b9d" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
          <path d="M54 16 C60 22, 60 34, 54 40" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
          <defs>
            <linearGradient id="mic-grad" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
        </svg>
        <div>
          <h1>Karafilt</h1>
          <p class="tagline">Real-time vocal removal</p>
        </div>
      </div>
      <div class="status-badge" id="status">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </header>

    <button id="toggle" class="btn-toggle">
      <svg class="btn-icon play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6,3 20,12 6,21"/>
      </svg>
      <svg class="btn-icon stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
      <span class="btn-label">Start Filtering</span>
    </button>

    <button id="open-lyrics-panel" class="btn-secondary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 5c0-1.1.9-2 2-2h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm12 0v14h4V5h-4z"/>
      </svg>
      <span>Open Lyrics Panel</span>
    </button>

    <div id="countdown-overlay" class="countdown-overlay" style="display:none">
      <div class="countdown-hint">Get ready — auto-syncing the video</div>
      <div class="countdown-number" id="countdown-number">3</div>
      <button id="countdown-cancel" class="countdown-cancel">Cancel</button>
    </div>

    <div class="section">
      <div class="section-header">
        <label for="mode">Algorithm</label>
      </div>
      <div class="select-wrap">
        <select id="mode">
          <option value="stft">Spectral (Good)</option>
          <option value="basic">Basic (Fast)</option>
          <option value="ai">AI Separation (Best)</option>
          <option value="ai2">AI + Deep Clean (Slower)</option>
        </select>
        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <span class="hint" id="mode-hint"></span>
    </div>

    <div class="section ai-panel" id="ai-options" style="display:none">
      <div class="section-header">
        <label for="ai-model">AI Model</label>
        <span class="badge">AI</span>
      </div>
      <div class="select-wrap">
        <select id="ai-model">
          <option value="htdemucs">Demucs Hybrid Transformer</option>
        </select>
        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <span class="hint" id="model-hint">Fetching models from server...</span>
      <div class="ai-status" id="ai-status" style="display:none">
        <span class="ai-status-dot"></span>
        <span class="ai-status-text"></span>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <label for="mix">Vocal Removal</label>
        <span class="mix-val" id="mix-value">100%</span>
      </div>
      <div class="slider-track">
        <input type="range" id="mix" min="0" max="100" value="100">
      </div>
    </div>

    <div class="settings-row">
      <button id="settings-toggle" class="settings-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
        </svg>
        <span>Settings</span>
      </button>
    </div>

    <div class="section settings-panel" id="settings-panel" style="display:none">
      <div class="section-header">
        <label for="server-url">Server URL</label>
      </div>
      <input type="text" id="server-url" class="text-input" placeholder="ws://localhost:9876" value="ws://localhost:9876">
      <span class="hint">WebSocket endpoint for AI processing</span>

      <div class="section-header" style="margin-top:8px">
        <label for="api-key">API Key</label>
        <span class="badge">Auth</span>
      </div>
      <input type="password" id="api-key" class="text-input" placeholder="Leave empty for local server">
      <span class="hint">Required for hosted backend</span>
    </div>

    <footer>
      <span class="footer-text">♪ Enjoy the music ♪</span>
    </footer>
  </div>

  <script src="../shared/controls-bindings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
