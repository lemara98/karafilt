<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1400px; height:560px; overflow:hidden; }
body { font-family:"Space Grotesk",sans-serif; background:#070912; color:#f1efff; position:relative; display:flex; }
.glow { position:absolute; width:900px; height:900px; border-radius:50%; top:-380px; left:-160px;
  background:radial-gradient(circle, rgba(139,124,255,.2) 0%, transparent 65%); }
.glow2 { position:absolute; width:800px; height:800px; border-radius:50%; bottom:-420px; right:-120px;
  background:radial-gradient(circle, rgba(180,108,255,.14) 0%, transparent 65%); }
.left { flex:1; padding:92px 0 0 90px; position:relative; }
.eyebrow { font-family:"JetBrains Mono",monospace; font-size:14px; font-weight:700; letter-spacing:6px; color:#a78bfa; margin-bottom:18px; }
img.mark { height:52px; margin-bottom:26px; display:block; }
h1 { font-size:52px; font-weight:700; line-height:1.08; letter-spacing:-1px; max-width:620px; }
h1 .accent { background:linear-gradient(90deg,#8b7cff,#c084fc); -webkit-background-clip:text; background-clip:text; color:transparent; }
.tag { margin-top:20px; font-size:19px; color:#9ba1c0; max-width:560px; line-height:1.5; }
.chips { display:flex; gap:10px; margin-top:30px; }
.chip { font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:2px; padding:7px 15px;
  border-radius:999px; background:rgba(139,124,255,.12); border:1px solid rgba(167,139,250,.35); color:#c9b8ff; }
.right { width:470px; position:relative; }
.frame { position:absolute; top:56px; left:0; width:388px; border-radius:16px 16px 0 0; overflow:hidden;
  border:1px solid rgba(255,255,255,.1); border-bottom:none; box-shadow:0 20px 80px rgba(139,124,255,.25); }
.frame img { width:384px; display:block; margin:1px; }
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="left">
  <div class="eyebrow">KARAFILT — CHROME EXTENSION</div>
  <img class="mark" src="wordmark.svg">
  <h1>The vocals drop out.<br><span class="accent">The music stays.</span></h1>
  <div class="tag">Real-time vocal removal, word-synced lyrics, playlists and a monthly singing scoreboard — on any tab, free.</div>
  <div class="chips"><span class="chip">VOCAL REMOVAL</span><span class="chip">SYNCED LYRICS</span><span class="chip">PLAYLISTS</span><span class="chip">PARTY MODE</span></div>
</div>
<div class="right"><div class="frame"><img src="panel-lyrics.png"></div></div>
</body></html>
